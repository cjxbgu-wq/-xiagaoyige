name: Build iOS Tweak DEB

on:
  push:
    tags: ['v*', 'release/*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      THEOS: /opt/theos
      FINALPACKAGE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "$THEOS/bin" >> $GITHUB_PATH
      
      - name: Install deps
        run: brew install ldid dpkg
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - run: pip install cryptography
      
      - name: Generate obfuscated sources
        run: python gen_obf_src.py
      
      - name: Build DEB
        run: |
          make clean
          make FINALPACKAGE=1
        env:
          THEOS: /opt/theos
          FINALPACKAGE: 1
      
      - name: Verify DEB
        run: |
          ls -la packages/
          dpkg-deb -I packages/*.deb
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vcam-deb
          path: packages/*.deb
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: packages/*.deb
          generate_release_notes: true
